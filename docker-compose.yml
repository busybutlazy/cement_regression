services:
  backend:
    build: ./backend
    container_name: tank-flow-backend
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: tank-flow-frontend
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "9870:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  internal:
    driver: bridge
