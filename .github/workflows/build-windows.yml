name: Build Windows Desktop App

on:
  push:
    tags: ['v*']     # 推送 v1.0.0 這類 tag 才觸發
  workflow_dispatch: # 也可以在 GitHub 網頁上手動觸發

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Python backend ────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -e ./backend
          pip install pyinstaller

      - name: Build backend with PyInstaller
        run: pyinstaller backend.spec --noconfirm --distpath backend_dist

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ── Electron installer ────────────────────────────────────────────────
      - name: Install Electron build dependencies
        working-directory: electron
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # electron-builder 自己下載正確版本
        run: npm ci

      - name: Build Windows installer
        working-directory: electron
        run: npm run dist

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-electron/*.exe
          retention-days: 30
          if-no-files-found: error
